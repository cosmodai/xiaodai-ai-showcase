<script>
const en = new URLSearchParams(location.search).get("lang") === "en";
const t = (zh, english) => en ? english : zh;
document.documentElement.lang = t("zh-Hans","en");
document.title = t("店铺装修诊断", "Storefront Audit") + " · Xiaodai AI";
const home = document.getElementById("home");
home.href = t("./","./?lang=en");
home.textContent = t("← 小戴 AI 作品集","← Xiaodai AI portfolio");
const language = document.getElementById("language");
language.href = t("?lang=en","?");
language.textContent = t("English","中文");
const byId = (id) => document.getElementById(id);
const label = (id, zh, english) => { byId(id).textContent = t(zh, english); };

label("title","店铺装修诊断","Storefront Audit");
label("intro","用虚构的 Maple Wok 演示从检查菜单首屏到确认改版方案。切换前后预览，核对导航、招牌菜和套餐信息。","Inspect a fictional Maple Wok storefront and switch between the original and proposed layouts to check navigation, the featured item and meal details.");
label("compare","首屏改版前后","Storefront before and after");
label("before","改版前","Before");
label("after","改版稿","Proposed");
label("audit-title","诊断与验收","Findings and acceptance");
label("skill","查看公开 Skill →","Read the public Skill →");
byId("hero").alt = t("虚构的枫糖辣鸡饭","Fictional maple chili chicken bowl");
function list(id, values) {
  byId(id).replaceChildren(...values.map(value => {
    const li = document.createElement("li");
    li.textContent = value;
    return li;
  }));
}
function show(after) {
  byId("before").setAttribute("aria-pressed",String(!after));
  byId("after").setAttribute("aria-pressed",String(after));
  byId("hero").toggleAttribute("data-crop",!after);
  label("store-title",after?"招牌枫糖辣鸡饭 · 650 克":"鸡肉饭",after?"Signature Maple Chili Chicken Bowl · 650 g":"Chicken Bowl");
  list("menu",after?t(["招牌碗饭","配菜","饮品"],["Signature Bowls","Sides","Drinks"]):t(["全部商品（22 项）"],["All items (22)"]));
  label("offer",after?"套餐含主菜和饮品。配菜可另加。":"套餐、饮品、配菜见商品详情。",after?"Meal includes a main and a drink. Sides can be added separately.":"See item details for meal, drink and sides.");
  list("findings",after?t(["三类导航可从首屏区分","商品名和规格完整可见","图片可看见完整餐碗","套餐所含与另购项分开"],["Three menu categories are visible","The dish name and portion are visible","The full bowl appears in the image","Included items and paid add-ons are distinct"]):t(["22 个菜品集中在一组","招牌菜缺规格","主图裁掉了餐碗","套餐和加购信息混在一起"],["22 items share a single category","The featured item has no portion size","The image crops out the bowl","Meal contents and add-ons are mixed together"]));
  label("state",after?"改版预览满足四项示例验收条件。":"原样发现四项可调整问题。",after?"The preview meets the four sample acceptance criteria.":"The original view has four actionable issues.");
}
byId("before").addEventListener("click",()=>show(false));
byId("after").addEventListener("click",()=>show(true));
show(false);
</script></body></html>
